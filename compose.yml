services:

  postgres:
    image: postgres:16
    container_name: invoice-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  qdrant:
    image: qdrant/qdrant
    container_name: invoice-qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7
    container_name: invoice-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  mock-erp:
    build:
      context: ./mock-erp
      dockerfile: Dockerfile

    container_name: invoice-mock-erp

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "8001:8000"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile

    container_name: invoice-agent

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

      REDIS_HOST: redis
      REDIS_PORT: 6379

      ERP_BASE_URL: http://mock-erp:8000

      GEMINI_API_KEY: ${GEMINI_API_KEY}

      LOG_LEVEL: ${LOG_LEVEL}

    ports:
      - "8000:8000"

    volumes:
      - ./data/incoming:/app/data/incoming
      - ./data/reports:/app/data/reports

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-erp:
        condition: service_started

    restart: unless-stopped


  streamlit-ui:
    build:
      context: ./streamlit-ui
      dockerfile: Dockerfile

    container_name: invoice-streamlit

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      AGENT_BASE_URL: http://agent:8000

    ports:
      - "8501:8501"

    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started

    restart: unless-stopped


volumes:
  postgres_data:
  qdrant_data: